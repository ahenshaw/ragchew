# Binaries, and the Windows installer.
#
# The matrix in `build.yml` proves the three platforms compile. This one
# produces something a person can run: a release build per platform, packaged,
# and — on Windows — an MSI that puts ragchew in the Start Menu.
#
# Two triggers, deliberately. A `v*` tag builds a release and attaches the
# artifacts to it, which is the published path. `workflow_dispatch` builds the
# same things and leaves them as run artifacts, so the packaging can be
# rehearsed, and fixed, without a tag that then has to be deleted.
#
# Nothing third-party here either, on the same reasoning as `build.yml`:
# `checkout` and `upload-artifact` are GitHub's own, and the release itself is
# made with the `gh` CLI, which is on every runner and authenticates with the
# token the workflow already has.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ragchew-linux-x86_64
          - os: macos-latest
            artifact: ragchew-macos-aarch64
          - os: windows-latest
            artifact: ragchew-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.os }}-cargo-

      # `--locked`, so what ships is built from the dependency versions in the
      # repository rather than whatever resolved that morning.
      - name: build
        run: cargo build --release --locked -p ragchew-gui --bin ragchew

      # Debug symbols are two thirds of the file and nothing a user of the
      # binary can do anything with; a backtrace from a release build names
      # functions either way.
      - name: strip
        if: runner.os != 'Windows'
        run: strip target/release/ragchew

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/ragchew README.md LICENSE dist/${{ matrix.artifact }}/
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          ls -la dist

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/ragchew.exe README.md LICENSE dist/${{ matrix.artifact }}/
          cd dist && 7z a ${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      # WiX v3 is on the runner image; cargo-wix is the cargo subcommand that
      # drives it. `--no-build` because the binary above is the one that should
      # ship: built once, from the locked dependencies, and already there.
      #
      # The manifest is named rather than the package, because the WiX source
      # is found relative to the manifest given and `gui/wix/main.wxs` is where
      # it lives. The version is passed explicitly for a duller reason: this
      # crate inherits its version from the workspace, and rather than find out
      # on a tag whether cargo-wix resolves that, it is read from the metadata
      # — which is the same number, resolved by cargo itself.
      - name: installer (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          cargo install cargo-wix --locked
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ragchew-gui") | .version')
          test -n "$version"
          cargo wix --no-build --nocapture \
            --install-version "$version" \
            --output "dist/${{ matrix.artifact }}.msi" \
            gui/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
          retention-days: 14

  # Only a tag publishes. A dispatched run stops at the artifacts above, which
  # is the whole point of being able to dispatch it.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # Draft, so the notes can be read — and the artifacts opened — before
      # anyone else sees the release. Publishing it is a button.
      #
      # Created if it is not there and added to if it is: a publish that failed
      # half way through, which is a network away on any run, is then a re-run
      # rather than a tag to delete and push again.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          files=$(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' \))
          test -n "$files"
          echo "$files"
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber $files
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "ragchew ${GITHUB_REF_NAME}" \
              --generate-notes \
              --draft \
              $files
          fi
