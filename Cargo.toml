[workspace]
members = ["gui"]
# The root package is a library, so the gui's `ragchew` binary is the only
# runnable target in the default set: bare `cargo run` starts the GUI, while
# `cargo build`/`cargo test` still cover both packages.
default-members = [".", "gui"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"

[package]
name = "ragchew"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-protocol HAM radio digital-mode codec library (JS8, Olivia MFSK)"

[lib]
name = "ragchew"
path = "src/lib.rs"

[dependencies]
rustfft = "6"

[profile.release]
opt-level = 3

# A debug build decodes far too slowly to keep up with live audio: one Olivia
# pass over its 24-second window across six modes measured 41 s unoptimized
# against 3.5 s optimized, and the decode threads then never sleep. Since
# `cargo run` gives a debug build, that is what most people meet first.
#
# The waterfall is the same story: rendering one 45-second view measured 177 ms
# a frame unoptimized, so a debug build ran the interface at six frames a
# second before anything had gone wrong. Both crates are therefore optimized in
# dev too, at the cost of stepping through them in a debugger — `cargo build`
# without this is still there when that is what is wanted.
[profile.dev.package."*"]
opt-level = 3

# Named as well as globbed: the `*` selector covers dependencies, and both of
# these are workspace members, which it does not reach.
[profile.dev.package.ragchew]
opt-level = 3

[profile.dev.package.ragchew-gui]
opt-level = 3
