[workspace]
members = ["gui"]
# The root package is a library, so the gui's `ragchew` binary is the only
# runnable target in the default set: bare `cargo run` starts the GUI, while
# `cargo build`/`cargo test` still cover both packages.
default-members = [".", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[package]
name = "ragchew"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-protocol HAM radio digital-mode codec library (JS8, Olivia MFSK)"

[lib]
name = "ragchew"
path = "src/lib.rs"

[dependencies]
rustfft = "6"

[profile.release]
opt-level = 3
