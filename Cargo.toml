[workspace]
members = ["gui"]
# The root package is a library, so the gui's `ragchew` binary is the only
# runnable target in the default set: bare `cargo run` starts the GUI, while
# `cargo build`/`cargo test` still cover both packages.
default-members = [".", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[package]
name = "ragchew"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-protocol HAM radio digital-mode codec library (JS8, Olivia MFSK)"

[lib]
name = "ragchew"
path = "src/lib.rs"

[dependencies]
rustfft = "6"

[profile.release]
opt-level = 3

# A debug build decodes far too slowly to keep up with live audio: one Olivia
# pass over its 24-second window across six modes measured 41 s unoptimised
# against 3.5 s optimised, and the decode threads then never sleep. Since
# `cargo run` gives a debug build, that is what most people meet first.
#
# So the codec and its dependencies are optimised even in dev, while the GUI
# crate itself stays unoptimised and debuggable. The DSP is not where anyone
# sets a breakpoint; the interface is.
[profile.dev.package."*"]
opt-level = 3

# Named as well as globbed: the `*` selector covers dependencies, and this
# crate is a workspace member as well as a path dependency of the GUI.
[profile.dev.package.ragchew]
opt-level = 3
