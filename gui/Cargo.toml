[package]
name = "ragchew-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ragchew — panoramic multi-protocol monitor (waterfall + inline decoded text)"

[lib]
name = "ragchew_gui"
path = "src/lib.rs"

[[bin]]
name = "ragchew"
path = "src/main.rs"

[features]
default = ["desktop"]
# The interactive eframe app + live audio. Disable (`--no-default-features`) to
# build just the pure rendering pieces (e.g. the render_png example) without the
# windowing/audio stack.
desktop = [
    "dep:eframe",
    "dep:cpal",
    "dep:clap",
    "dep:rfd",
    "dep:serde",
    "dep:serde_json",
    "dep:egui-elegance",
]

[dependencies]
ragchew = { path = ".." }
eframe = { version = "0.35", optional = true, default-features = true, features = [
    "persistence",
] }
cpal = { version = "0.18", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
# Native file dialogs. The default backend wants GTK3 development headers; on a
# machine without them, `default-features = false, features = ["xdg-portal",
# "async-std"]` uses the desktop portal instead.
rfd = { version = "0.17", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
# Reading `pw-dump`, which is how the PipeWire graph is inspected. See
# `pipewire.rs` for why that is a subprocess rather than libpipewire.
serde_json = { version = "1", optional = true }
# Widget styling for the desktop app: an installable theme that the egui
# built-ins inherit, plus a few widgets of its own. Pinned to the same egui as
# eframe pulls in — it tracks egui's release cadence, so a bump here has to move
# with one there.
egui-elegance = { version = "0.14", optional = true }

[dev-dependencies]
png = "0.17"
serde_json = "1"
