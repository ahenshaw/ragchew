[package]
name = "ragchew-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ragchew — panoramic multi-protocol monitor (waterfall + inline decoded text)"

[lib]
name = "ragchew_gui"
path = "src/lib.rs"

[[bin]]
name = "ragchew"
path = "src/main.rs"

[features]
default = ["desktop", "elecraft", "yaesu"]
# The interactive eframe app + live audio. Disable (`--no-default-features`) to
# build just the pure rendering pieces (e.g. the render_png example) without the
# windowing/audio stack.
desktop = [
    "dep:eframe",
    "dep:cpal",
    "dep:clap",
    "dep:rfd",
    "dep:serde",
    "dep:serde_json",
    "dep:egui-elegance",
]

# ---- rigs driven directly, over a cable, with no daemon in between ----
#
# One feature per radio, because they are separate protocols with nothing in
# common above the port: an operator with a KX3 has no use for the code that
# talks to something else. `rigctld` is not among them — it is one protocol for
# every rig hamlib knows, so it is always built.
#
# Turning all of them off leaves an app that still keys, tunes and reads back
# through hamlib. A build without a given rig reads a settings file naming it,
# declines to key anything, and keeps the port and the rate — those are their
# own fields and are carried through untouched, so the tedious part of the
# configuration survives swapping builds. The choice of radio itself resets to
# none, which is what this app already does with a theme or a mode name it does
# not recognize, and is one click to put back.

# The serial port itself, shared by every rig above. Not a rig and not meant to
# be selected on its own — whichever rig features are on turn it on. On its own
# it is a port with nothing to say into it.
serial = ["dep:libc", "dep:windows-sys"]

# Semicolon-terminated ASCII CAT, which both makes below happen to speak. Also
# not a rig, and turned on the same way: it is the link, not the vocabulary.
cat = ["serial"]

# An Elecraft KX3 or K3 on a serial cable.
elecraft = ["cat"]

# A Yaesu on a serial cable: FT-991A, FT-891, FT-710, FTDX10, FTDX101, and back
# through the FT-450D and FTDX3000. The older 5-byte binary CAT of an FT-817 or
# FT-857 is a different protocol and is not this.
yaesu = ["cat"]

[dependencies]
ragchew = { path = ".." }
eframe = { version = "0.35", optional = true, default-features = true, features = [
    "persistence",
] }
cpal = { version = "0.18", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
# Native file dialogs. The default backend wants GTK3 development headers; on a
# machine without them, `default-features = false, features = ["xdg-portal",
# "async-std"]` uses the desktop portal instead.
rfd = { version = "0.17", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
# Reading `pw-dump`, which is how the PipeWire graph is inspected. See
# `pipewire.rs` for why that is a subprocess rather than libpipewire.
serde_json = { version = "1", optional = true }
# Widget styling for the desktop app: an installable theme that the egui
# built-ins inherit, plus a few widgets of its own. Pinned to the same egui as
# eframe pulls in — it tracks egui's release cadence, so a bump here has to move
# with one there.
egui-elegance = { version = "0.14", optional = true }

# Serial ports, for a radio on a cable rather than behind a daemon. Neither of
# these is a dependency in any meaningful sense: on Unix cpal already pulls in
# libc, and on Windows winit already pulls in windows-sys, so each platform is
# asking for a header it has rather than adding a crate to its build. `termios`
# on one side and `DCB` on the other is all that is wanted — see `rig/serial`
# for why that is by hand rather than a serial-port crate.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# Kept at the version winit resolves to, so the two unify into one build of it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    # Not for anything this asks the security API to do: `CreateFileW` takes a
    # `SECURITY_ATTRIBUTES` pointer, which is null here, and windows-sys gates
    # the whole function on the feature that declares the type.
    "Win32_Security",
] }

[dev-dependencies]
png = "0.17"
serde_json = "1"
